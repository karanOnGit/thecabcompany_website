<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004e92;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000428;stop-opacity:1" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur" />
      <feMerge>
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(125, 50)" filter="url(#f1)">
    <circle cx="75" cy="75" r="70" fill="url(#grad1)" stroke="#ffffff" stroke-width="3" />
    <path d="M50 50 L50 100 M90 50 L90 100 M50 75 L90 75" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <path d="M60 40 V110 M60 75 L95 40 M60 75 L95 110 M100 40 H130 A15 15 0 0 1 130 75 H100 M100 75 H135 A15 15 0 0 1 135 110 H100 V40" 
          stroke="#ffffff" stroke-width="0" fill="none" /> 
    
    <text x="75" y="95" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle">KB</text>
  </g>

</svg>